# pnpm build-script allowlist only (SPEC §11.2.1). No "packages" key: Nx must keep the tsconfig-paths layout.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  nx: true
  unrs-resolver: true
  electron: true
  '@nestjs/core': false
  edgedriver: false
  electron-winstaller: true
  geckodriver: false
minimumReleaseAgeExclude:
  - '@wdio/cli@9.31.7'
  - '@wdio/config@9.31.7'
  - '@wdio/local-runner@9.31.7'
  - '@wdio/mocha-framework@9.31.7'
  - '@wdio/runner@9.31.7'
  - '@wdio/utils@9.31.7'
  - webdriver@9.31.7
  - webdriverio@9.31.7
