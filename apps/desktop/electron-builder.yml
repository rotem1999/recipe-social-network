# SPEC.md §11.1 (targets Windows, macOS, Linux) and §11.2.2 (electron-builder 26.15.3).
# Keys per app-builder-lib 26.15.3 scheme.json (SPEC §16 E4).
appId: dev.rsn.cookbook
productName: CookBook
directories:
  output: ../../dist/apps/desktop
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
